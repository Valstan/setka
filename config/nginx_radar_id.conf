# Радар-ID (ЕСА, OIDC SSO): вход.вмалмыже.рф (punycode) → uvicorn :8000
#
# Punycode: вход.вмалмыже.рф = xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai
#
# Это ВХОД ВСЕЙ ЭКОСИСТЕМЫ: здесь страница логина, OIDC-провайдер для соседних
# проектов (trener, Сабантуй, портал вМалмыже) и публичный каталог /services.
# Правка этого блока задевает не только SETKA — см. docs/ops/HOSTS.md.
#
# TLS терминируется на edge Джино (привязка поддомена + Let's Encrypt в панели
# провайдера, авто-продление там же). Certbot на боксе для `.рф`-поддоменов НЕ
# используем: до бокса запрос доходит уже расшифрованным, ACME-проверка на 80-м
# порту сюда не попадает. Локейшн acme-challenge оставлен на случай, если схема
# TLS когда-нибудь сменится на боксовую.
#
# ⚠️ Зависимость: блок использует `$setka_needs_https` и `$setka_forwarded_proto`
# из `config/nginx_maps.conf` (на проде — `/etc/nginx/conf.d/setka_maps.conf`).
# Без этого файла nginx не стартует вовсе («unknown variable») — ставить оба.
#
# Установка на прод:
#   sudo cp config/nginx_maps.conf /etc/nginx/conf.d/setka_maps.conf
#   sudo cp config/nginx_radar_id.conf /etc/nginx/conf.d/radar_id.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name xn--b1ae3a1a.xn--80adkdyec4j.xn--p1ai;
    client_max_body_size 20m;

    # Редиректы, которые генерирует сам nginx (хвостовой слэш и т.п.), должны
    # оставаться относительными: иначе в Location уедет punycode-имя со схемой
    # $scheme (а она здесь всегда http) — лишний виток http→https и «xn--…» в
    # адресной строке. Так же в radar_feed.conf и sarafan.conf.
    absolute_redirect off;

    # Голый http → https (заказ владельца 2026-08-02). Здесь это не косметика:
    # на этой странице человек вводит пароль, а сессионная кука выдаётся с
    # флагом Secure (web/api/auth.py) — по http она не отправляется вовсе, то
    # есть вход с http-адреса не просто небезопасен, он молча не работает.
    # Условие и его режим отказа — в config/nginx_maps.conf.
    if ($setka_needs_https) {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Настоящая схема клиента, а не $scheme (тот здесь всегда http):
        # по ней приложение строит абсолютные URL единого входа и OIDC.
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /home/valstan/SETKA/logs/nginx_radar_id_access.log;
    error_log /home/valstan/SETKA/logs/nginx_radar_id_error.log;
}
