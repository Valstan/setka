# валентин.вмалмыже.рф → СТАТИКА сайта-визитки @valstan (Next static export из
# /home/valstan/valentin/current). Приложения SETKA не касается вовсе.
#
# Сайт принадлежит проекту ValentinPortfolio, но раздаётся нашим nginx на нашем
# боксе — поэтому конфиг живёт здесь. Правит его содержимое чужой деплой, а
# транспорт (TLS, заголовки) — мы.
#
# СНЯТО С ПРОДА 2026-08-02, добавлен только редирект на https (заказ владельца:
# «все сервисы вмалмыже должны работать на https»). Карта — docs/ops/HOSTS.md.
#
# Установка на прод:
#   sudo cp config/nginx_maps.conf /etc/nginx/conf.d/setka_maps.conf
#   sudo cp config/nginx_valentin.conf /etc/nginx/conf.d/valentin.conf
#   sudo nginx -t && sudo systemctl reload nginx

# валентин.вмалмыже.рф (punycode xn--80adkmnnb2b.xn--80adkdyec4j.xn--p1ai)
# Сайт-визитка @valstan: Next 15 static export, отдаётся nginx напрямую (RAM ≈ 0).
# Создан 2026-08-02. TLS терминируется на edge Джино (LE через панель, авто-продление),
# как у radar_id.conf/radar_feed.conf — свой :443 здесь снаружи недостижим (G150).
server {
    listen 80;
    server_name xn--80adkmnnb2b.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;
    charset_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Голый http → https (заказ владельца 2026-08-02). Условие и его режим
    # отказа — в config/nginx_maps.conf; здесь тот же приём, что у остальных
    # `*.вмалмыже.рф`: схему знает только заголовок от edge Джино.
    if ($setka_needs_https) {
        return 301 https://$host$request_uri;
    }

    root /home/valstan/valentin/current;
    index index.html;

    # next.config: trailingSlash: true → каталоги с index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Хэшированные ассеты Next — можно кэшировать навсегда
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /shots/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML не кэшируем надолго, иначе новый релиз не виден до истечения кэша
    location ~* \.(?:html|txt|json|xml)$ {
        add_header Cache-Control "public, max-age=300";
    }

    access_log /home/valstan/valentin/nginx_access.log;
    error_log /home/valstan/valentin/nginx_error.log;
}
