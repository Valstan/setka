# Общие map-переменные nginx для SETKA. На проде — /etc/nginx/conf.d/setka_maps.conf.
#
# `$setka_forwarded_proto` — настоящая схема клиента.
#
# Зачем. Публичные домены (`*.вмалмыже.рф`) терминируют TLS на edge-прокси
# Джино и приходят на бокс по http, порт 80. Значит `$scheme` в серверных
# блоках этих доменов ВСЕГДА "http", и по нему нельзя ни отличить https-визит
# от голого http, ни сказать приложению правду о схеме. Правду знает только
# заголовок `X-Forwarded-Proto` от edge (замер 2026-08-02: https-запрос → https,
# http-запрос → http).
#
# Фолбэк на `$scheme` — для случаев, где заголовка нет вовсе: обращение прямо
# на бокс (мониторинг, curl с localhost) и блок технического домена
# `3931b3fe50ab.vps.myjino.ru`, где TLS терминируется на самом боксе certbot'ом.
#
# Используется в: sarafan.conf, radar_id.conf, radar_feed.conf,
# setka_http_redirect_domain.conf.
map $http_x_forwarded_proto $setka_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# `$setka_needs_https` — надо ли увести этот запрос на https (заказ владельца
# 2026-08-02: «все сервисы вмалмыже должны работать на https»).
#
# ⚠️ ТОЛЬКО для блоков ЗА edge-прокси Джино (`*.вмалмыже.рф`). Карта читает
# сырой заголовок без фолбэка на `$scheme` — намеренно, но это значит, что на
# домене, где TLS терминируется НА БОКСЕ (технический `*.vps.myjino.ru`
# с certbot, `default_server`), заголовка нет вовсе, карта даёт 0 и редиректа
# не будет НИКОГДА. Там работает своё условие `!= "https"`, и переводить те
# блоки на эту карту нельзя: получится «починили единообразие, а техдомен
# тихо перестал уводить на https», причём проверка в релизной памятке станет
# зеленее прежнего и регрессию не покажет.
#
# Два условия сразу, поэтому это map, а не `if`: у nginx нет «И» в директиве if.
#
# 1. Схема ДОЛЖНА быть явно "http". Не «не равно https»: если edge однажды
#    перестанет слать заголовок, вариант «!= https» даёт вечный редирект
#    https→https и домен ложится целиком — чинится только по SSH. Явное "http"
#    в том же случае деградирует к сегодняшнему поведению.
# 2. Только GET и HEAD. Server-to-server POST по голому http (OIDC token,
#    ingest рутины, ВК-шлюз) 301 бы сломал: HTTP-клиенты на редиректе часто
#    превращают POST в GET и теряют тело. Такой POST лучше пусть работает, чем
#    молча отвалится у соседа; голый http у машинных дверей лечится их
#    настройкой, а не нашим редиректом.
map "$http_x_forwarded_proto:$request_method" $setka_needs_https {
    default              0;
    "~^http:(GET|HEAD)$" 1;
}
