# Общие map-переменные nginx для SETKA. На проде — /etc/nginx/conf.d/setka_maps.conf.
#
# `$setka_forwarded_proto` — настоящая схема клиента.
#
# Зачем. Публичные домены (`*.вмалмыже.рф`) терминируют TLS на edge-прокси
# Джино и приходят на бокс по http, порт 80. Значит `$scheme` в серверных
# блоках этих доменов ВСЕГДА "http", и по нему нельзя ни отличить https-визит
# от голого http, ни сказать приложению правду о схеме. Правду знает только
# заголовок `X-Forwarded-Proto` от edge (замер 2026-08-02: https-запрос → https,
# http-запрос → http).
#
# Фолбэк на `$scheme` — для случаев, где заголовка нет вовсе: обращение прямо
# на бокс (мониторинг, curl с localhost) и блок технического домена
# `3931b3fe50ab.vps.myjino.ru`, где TLS терминируется на самом боксе certbot'ом.
#
# Используется в: sarafan.conf, setka_http_redirect_domain.conf.
map $http_x_forwarded_proto $setka_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
