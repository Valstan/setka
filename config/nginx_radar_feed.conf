# Радар-лента: радар.вмалмыже.рф (punycode) → uvicorn :8000
#
# Punycode: радар.вмалмыже.рф = xn--80aal0cd.xn--80adkdyec4j.xn--p1ai
#
# Личный кабинет пользователей роли `radar`. Интерфейс живёт на КОРНЕ этого
# домена (заказ владельца 2026-07-26: адрес без лишнего «/radar»).
#
# ⚠️ РЕШЕНИЕ «корень = Радар» ПРИНИМАЕТ ТОЛЬКО ПРИЛОЖЕНИЕ (`is_radar_host` в
# modules/radar_id/vk_upstream.py, роуты `/` и `/radar` в main.py). Здесь этого
# правила быть не должно ни в каком виде.
#
# Почему так строго. Блок создан 2026-07-18 с `location = / { return 302 /radar; }`
# — тогда Радар действительно жил на `/radar`. 26.07 интерфейс переехал на корень,
# и приложение стало отвечать на `/radar` редиректом на `/`. Две копии одного
# решения разошлись, и получилась ПЕТЛЯ: nginx гнал `/` → `/radar`, приложение
# `/radar` → `/`. Аноним её не видел (его на первом же шаге уводило на страницу
# входа), поэтому баг жил незамеченным неделю: он бил ровно по тем, кто УЖЕ вошёл,
# то есть по всем настоящим пользователям Радара. Найдено 2026-08-02 прогоном
# цепочки редиректов с живой сессией через nginx.
#
# Карта доменов и кто за что отвечает — docs/ops/HOSTS.md.
#
# TLS терминируется на edge Джино, как у radar_id.conf (см. комментарий там).
#
# ⚠️ Зависимость: блок использует `$setka_needs_https` и `$setka_forwarded_proto`
# из `config/nginx_maps.conf` (на проде — `/etc/nginx/conf.d/setka_maps.conf`).
# Без этого файла nginx не стартует вовсе («unknown variable») — ставить оба.
#
# Установка на прод:
#   sudo cp config/nginx_maps.conf /etc/nginx/conf.d/setka_maps.conf
#   sudo cp config/nginx_radar_feed.conf /etc/nginx/conf.d/radar_feed.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name xn--80aal0cd.xn--80adkdyec4j.xn--p1ai;
    client_max_body_size 20m;

    absolute_redirect off;

    # Голый http → https (заказ владельца 2026-08-02). Пользователь Радара
    # приезжает сюда после входа на вход.вмалмыже.рф, а сессионная кука имеет
    # флаг Secure — по http кабинет просто не открылся бы (вечный круг «войдите»).
    # Условие и его режим отказа — в config/nginx_maps.conf.
    if ($setka_needs_https) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Настоящая схема клиента, а не $scheme (тот здесь всегда http).
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /home/valstan/SETKA/logs/nginx_radar_feed_access.log;
    error_log /home/valstan/SETKA/logs/nginx_radar_feed_error.log;
}
