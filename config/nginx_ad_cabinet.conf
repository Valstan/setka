# Кабинет рекламодателя: кабинет.вмалмыже.рф (punycode) → uvicorn :8000
#
# Punycode: кабинет.вмалмыже.рф = xn--80acmlhv0b.xn--80adkdyec4j.xn--p1ai
#
# Клиентская половина рекламного CRM (роль `advertiser`). Интерфейс живёт на
# КОРНЕ этого домена — как у Радара.
#
# ⚠️ РЕШЕНИЕ «корень = кабинет» ПРИНИМАЕТ ТОЛЬКО ПРИЛОЖЕНИЕ (`is_ad_cabinet_host`
# в modules/radar_id/vk_upstream.py, роуты `/` и `/cabinet` в main.py). Здесь
# этого правила быть не должно ни в каком виде — см. историю петли редиректов
# в nginx_radar_feed.conf (инцидент 2026-08-02): две копии одного решения
# разошлись молча и били ровно по вошедшим пользователям.
#
# Карта доменов и кто за что отвечает — docs/ops/HOSTS.md.
#
# TLS терминируется на edge Джино (панель: привязка поддомена + Let's Encrypt,
# авто-продление там же). Certbot на боксе для .рф-поддоменов НЕ используется.
#
# ⚠️ Зависимость: блок использует `$setka_needs_https` и `$setka_forwarded_proto`
# из `config/nginx_maps.conf` (на проде — `/etc/nginx/conf.d/setka_maps.conf`).
# Без этого файла nginx не стартует вовсе («unknown variable») — ставить оба.
#
# Установка на прод:
#   sudo cp config/nginx_maps.conf /etc/nginx/conf.d/setka_maps.conf
#   sudo cp config/nginx_ad_cabinet.conf /etc/nginx/conf.d/ad_cabinet.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name xn--80acmlhv0b.xn--80adkdyec4j.xn--p1ai;
    # Фото клиента к посту — до 12 МБ файл (лимит приложения) + запас формы.
    client_max_body_size 20m;

    absolute_redirect off;

    # Голый http → https: сессионная кука имеет флаг Secure — по http кабинет
    # просто не открылся бы (вечный круг «войдите»). Условие и его режим
    # отказа — в config/nginx_maps.conf.
    if ($setka_needs_https) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Настоящая схема клиента, а не $scheme (тот здесь всегда http).
        proxy_set_header X-Forwarded-Proto $setka_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /home/valstan/SETKA/logs/nginx_ad_cabinet_access.log;
    error_log /home/valstan/SETKA/logs/nginx_ad_cabinet_error.log;
}
