# Сарафан: сарафан.вмалмыже.рф → uvicorn :8000
#
# Заказ владельца 2026-07-25: у самого Сарафана должен быть человеческий домен,
# а не технический `3931b3fe50ab.vps.myjino.ru`.
#
# Punycode: сарафан.вмалмыже.рф = xn--80aaa6cmey.xn--80adkdyec4j.xn--p1ai
#
# TLS. Слушаем ТОЛЬКО 80 — сертификат живёт на edge Джино (привязка поддомена
# + Let's Encrypt делаются в панели провайдера, авто-продление там же). Certbot
# на боксе для `.рф`-поддоменов НЕ используем: до бокса запрос доходит уже
# расшифрованным, и ACME-проверка на 80-м порту сюда не попадает. Тот же
# приём, что у radar_id.conf (вход.вмалмыже.рф) и radar_feed.conf
# (радар.вмалмыже.рф) — конфиг ниже намеренно повторяет их слово в слово.
#
# Установка на прод:
#   sudo cp config/nginx_sarafan.conf /etc/nginx/conf.d/sarafan.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# До появления A-записи и привязки в панели блок безвреден: он отвечает только
# на этот Host, которого пока никто не шлёт.

server {
    listen 80;
    server_name xn--80aaa6cmey.xn--80adkdyec4j.xn--p1ai;

    # Загрузка картинок (сетевая рассылка, ad-CRM, обложки): дефолт nginx 1 МБ
    # режет тело >1 МБ ответом 413 ДО приложения. Держим выше прикладного
    # лимита (12 МБ в modules/broadcast/service.py), чтобы оверсайз ловил
    # понятный 400 приложения, а не сырой nginx-413.
    client_max_body_size 20m;

    # Приложение отдаёт относительные редиректы — иначе nginx подставит в
    # Location имя сервера в punycode и пользователь увидит «xn--...» в адресе.
    absolute_redirect off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    access_log /home/valstan/SETKA/logs/nginx_sarafan_access.log;
    error_log /home/valstan/SETKA/logs/nginx_sarafan_error.log;
}
