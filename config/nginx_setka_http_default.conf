# default_server на 80-м порту: запросы с НЕИЗВЕСТНЫМ Host (прямой заход по IP,
# внутренние проверки, сканеры). Отдаёт то же приложение.
#
# Намеренно БЕЗ редиректа на https: через этот блок ходят локальные проверки, а
# апгрейд сломал бы их без пользы — снаружи по IP наш публичный сертификат всё
# равно не предъявишь. Карту `$setka_needs_https` тут не применять (заголовка
# от edge нет, см. config/nginx_maps.conf).
#
# СНЯТО С ПРОДА 2026-08-02 как есть. Карта доменов — docs/ops/HOSTS.md.
#
# Установка на прод:
#   sudo cp config/nginx_setka_http_default.conf /etc/nginx/conf.d/setka_http_default.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static {
        alias /home/valstan/SETKA/web/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /home/valstan/SETKA/logs/nginx_access_http_default.log;
    error_log  /home/valstan/SETKA/logs/nginx_error_http_default.log;
}
