name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Полная история — gitleaks ниже сканирует не только рабочее дерево,
          # но и коммиты: секрет, удалённый следующим коммитом, остаётся в
          # истории и утёкшим быть не перестаёт.
          fetch-depth: 0

      # Секрет-сканер (заведён 2026-08-12 после угона Telegram-ботов). До этого
      # дня сканера в контуре не было вообще.
      #
      # Почему отдельным шагом, а не хуком в .pre-commit-config.yaml, хотя выше
      # заявлен «один источник правил линтинга»: хук gitleaks в pre-commit —
      # `language: golang`, то есть требует Go-тулчейн на машине разработчика.
      # Прибивание линтеров к недоступному локально окружению уже дважды ломало
      # pre-commit владельцу (инциденты 2026-05-22 и 2026-05-23, см. шапку
      # .pre-commit-config.yaml), а на Windows Go не стоит. Гейт на мерж от
      # этого не слабеет — CI обязателен для PR; локальную проверку можно
      # добавить на конкретной машине, где есть бинарник.
      #
      # --redact обязателен: без него найденный секрет печатается в лог CI и
      # утечка расширяется ровно тем шагом, который её ищет.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Editable install — registers `setka` as a package so
          # `from modules.X import Y` works without sys.path.insert hacks
          # in scripts/* and tests/*.
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Линт гоняется ОДНИМ шагом через pre-commit и БЕЗ continue-on-error
      # (ревизия гейтов #104, 2026-07-28). Что было до:
      #
      #   * три отдельных шага (flake8/black/isort) стояли под
      #     `continue-on-error: true` — печатали ошибки и не влияли на итог
      #     job'а. Required-check ветки main — ровно `test (3.12)`, то есть
      #     контур санкционировал мерж по одним тестам, а зелёный значок
      #     читался как «линт прошёл»;
      #   * инструменты ставились `pip install flake8 black isort` БЕЗ версий,
      #     то есть набор правил в CI плавал сам по себе и расходился с
      #     пришпиленными ревизиями в .pre-commit-config.yaml. Свежий black
      #     хотел переформатировать ~40 файлов, которые pinned black 24.10.0
      #     считает нормальными, — шаг падал на чистом коде, и этого никто не
      #     видел ровно из-за continue-on-error.
      #
      # Отсюда правило: один источник правил линтинга. CI исполняет тот же
      # .pre-commit-config.yaml с теми же ревизиями, что и локальный хук, —
      # разойтись им больше нечем.
      - name: Lint (pre-commit — black, isort, flake8)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q --cov=modules --cov=tasks --cov=config \
            --cov-report=xml --cov-report=term-missing
        env:
          # Provide dummy values so config/runtime.py doesn't crash
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Upload coverage to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
