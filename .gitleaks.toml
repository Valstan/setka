# Конфиг секрет-сканера. Заведён 2026-08-12 после угона Telegram-ботов:
# сканера в контуре не было вовсе (крупнейший незакрытый техдолг по
# docs/PENDING_FOLLOWUPS.md), и утечку токена нашли постфактум глазами.
#
# Дефолтный набор (несколько сотен правил) включён через [extend] и дополнен
# ДВУМЯ своими правилами ниже. Раньше здесь стоял комментарий, утверждавший,
# что дефолт «включая telegram-bot-api-token, vk-access-token, generic-api-key»
# нас закрывает. Это было неверно в обе стороны, и цена ошибки оказалась
# буквальной — замер 2026-08-20 бинарником 8.21.2:
#
#   * правила `vk-access-token` в дефолтном наборе НЕТ вовсе (ни одного из ~200
#     правил не упоминает VK), а `generic-api-key` ловит `vk1.a.…` только в
#     присвоении — тот же токен в URL или в repr объекта проезжает;
#   * `telegram-bot-api-token` требует тело `A[a-z0-9_-]{34}` — после первой `A`
#     строго СТРОЧНЫЕ. У настоящих токенов Bot API после двоеточия всегда `AA`,
#     то есть правило не ловит НИ ОДИН живой токен. Плюс оно требует рядом слово
#     `telegr` и оператор присваивания, поэтому форма `/bot<ТОКЕН>/sendMessage`
#     (та самая, которой у нас утекло) не ловится ни при каком регистре.
#
# Проверено не рассуждением, а прогоном: корпус из 10 синтетических секретов в
# пяти зонах репозитория дефолт ловил 2/10, с правилами ниже — 10/10. И тем же
# прогоном по истории нашлись 6 настоящих секретов в двух коммитах, о которых
# слепой гейт год рапортовал `no leaks found` (см. .gitleaksignore).

[extend]
useDefault = true

# ─── Свои правила: формы, которыми у нас РЕАЛЬНО утекало ─────────────────────
#
# Регулярки намеренно совпадают с utils/log_redaction.py: маскирование логов и
# секрет-сканер обязаны считать секретом одно и то же. Пока они расходились,
# редактор логов знал про `vk1.a.…` и про токен в пути URL, а гейт — нет.
# Инвариант проверяется тестом tests/test_logging/test_secret_scanner_config.py.

[[rules]]
id = "setka-telegram-bot-token"
description = "Telegram Bot API token (в т.ч. в пути URL — форма инцидента 2026-08-12)"
# Литерал `bot` в начале не украшение: главная форма утечки — путь
# `/bot<ТОКЕН>/sendMessage`, где между `t` и цифрой нет границы слова.
regex = '''(?:bot)?[0-9]{6,12}:[A-Za-z0-9_-]{30,}'''

[[rules]]
id = "setka-vk-access-token"
description = "VK access token нового формата vk1.a.* (форма инцидента 2026-08-19)"
regex = '''vk1\.a\.[A-Za-z0-9_-]{20,}'''

[allowlist]
description = "Синтетические значения в тестах и примерах конфигов"

paths = [
  # Тесты маскирования обязаны содержать строки ФОРМАТА секретов — иначе они
  # не проверяют ничего. Значения синтетические (см. комментарий в файле).
  '''tests/test_logging/test_log_redaction\.py''',
  '''tests/test_logging/test_secret_scanner_config\.py''',
  '''tests/test_monitoring/test_telegram_bot_guard\.py''',
  # Шаблоны окружения: значения — плейсхолдеры вида CHANGE_ME.
  '''\.env\.example''',
  '''config/setka\.env\.example''',
]

regexes = [
  # Явные плейсхолдеры в любом файле.
  '''placeholder''',
  '''CHANGE_ME''',
  '''(?i)your[_-]?(token|key|secret)[_-]?here''',
]
